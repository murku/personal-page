<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lajos György Kocsán</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200&display=swap" rel="stylesheet">
    <style>
        :root {
            --azure: #0EA5E9;
            --deep-blue: #1E3A8A;
            --midnight: #0C1222;
            --silver: #E2E8F0;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, var(--midnight) 0%, #1a2942 50%, #2a3f5f 100%);
            color: var(--silver);
            overflow-x: hidden;
            min-height: 100vh;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 1;
        }
        
        header {
            text-align: center;
            padding-top: 4rem;
            position: relative;
            z-index: 2;
            opacity: 0;
            animation: fadeSlideDown 1.2s ease-out 0.3s forwards;
        }
        
        h1 {
            font-size: 1.1rem;
            font-weight: 200;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--silver);
            opacity: 0.7;
        }
        
        @keyframes fadeSlideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .corner-accent {
            position: fixed;
            width: 200px;
            height: 200px;
            pointer-events: none;
            z-index: 0;
            opacity: 0.15;
        }
        
        .corner-accent.top-left {
            top: 0;
            left: 0;
            background: linear-gradient(135deg, var(--azure) 0%, transparent 70%);
            clip-path: polygon(0 0, 100% 0, 0 100%);
        }
        
        .corner-accent.bottom-right {
            bottom: 0;
            right: 0;
            background: linear-gradient(315deg, var(--deep-blue) 0%, transparent 70%);
            clip-path: polygon(100% 0, 100% 100%, 0 100%);
        }
        
        @media (max-width: 768px) {
            .corner-accent {
                width: 120px;
                height: 120px;
            }
        }
    </style>
    <link rel="icon" type="image/x-icon" href="favicons/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="favicons/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicons/favicon-32x32.png">
    <link rel="apple-touch-icon" href="favicons/apple-touch-icon.png">
</head>
<body>
    <div class="corner-accent top-left"></div>
    <div class="corner-accent bottom-right"></div>
    
    <header>
        <h1>Lajos György Kocsán</h1>
    </header>

    <script data-goatcounter="https://lajoskocsan.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
